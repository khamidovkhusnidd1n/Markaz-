server {
    listen 80;
    server_name www.uzbamalaka.uz;
    return 301 http://uzbamalaka.uz$request_uri;
}

server {
    listen 80;
    server_name uzbamalaka.uz;
    return 301 https://uzbamalaka.uz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.uzbamalaka.uz;
    return 301 https://uzbamalaka.uz$request_uri;

    ssl_certificate /etc/letsencrypt/live/uzbamalaka.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzbamalaka.uz/privkey.pem;
}

server {
    listen 443 ssl http2;
    server_name uzbamalaka.uz;

    ssl_certificate /etc/letsencrypt/live/uzbamalaka.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzbamalaka.uz/privkey.pem;

    root /var/www/uzbamalaka/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
